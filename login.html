<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ponte Dourada</title>
    <script src="scripts/script.js"></script>
    <link rel="stylesheet" href="estilos/style.css" />
  </head>
  <body>
    <div class="principal">
      <img
        src="img/Logotipos/PonteDourada.svg"
        alt="Ponte Dourada"
        class="logo-principal-login"
      />
      <form onsubmit="logar(event)">
        <div class="input-group">
          <input type="text" name="email" required id="email" placeholder=" " />
          <label>Login</label>
        </div>
        <div class="input-group">
          <input
            type="password"
            name="senha"
            required
            id="senha"
            placeholder=" "
          />
          <label>Senha</label>
        </div>
        <input type="submit" value="Logar" id="logar-id" />
      </form>
    </div>
  </body>
</html>
